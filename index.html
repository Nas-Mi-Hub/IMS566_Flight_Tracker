<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Tracker - Login</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body p-4 text-center">
                    <h3 class="mb-4 text-primary">✈️ AeroTrack</h3>
                    <p class="text-muted">Login to manage flights</p>
                    
                    <!-- Error Message -->
                    <div id="loginError" class="alert alert-danger d-none" role="alert">
                        Invalid username or password!
                    </div>

                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3 text-start">
                            <label class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="Enter 'admin'" required>
                        </div>
                        <div class="mb-3 text-start">
                            <label class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter 'admin123'" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
