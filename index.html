<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Tracker - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="mb-4 text-primary text-center">✈️ AeroTrack</h3>
                    
                    <!-- Tabs -->
                    <ul class="nav nav-tabs mb-4" id="authTabs">
                        <li class="nav-item">
                            <a class="nav-link active" data-bs-toggle="tab" data-tab="admin" href="#adminTab">Admin Login</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" data-bs-toggle="tab" data-tab="user" href="#userTab">User Login</a>
                        </li>
                    </ul>

                    <div class="tab-content">
                        <!-- Admin Tab -->
                        <div class="tab-pane fade show active" id="adminTab">
                            <form onsubmit="handleLogin(event)">
                                <div class="mb-3">
                                    <label class="form-label">Admin Username</label>
                                    <input type="text" id="adminUsername" class="form-control" placeholder="admin" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="adminPassword" class="form-control" placeholder="admin123" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login as Admin</button>
                            </form>
                        </div>

                        <!-- User Tab -->
                        <div class="tab-pane fade" id="userTab">
                            <form onsubmit="handleLogin(event)">
                                <div class="mb-3">
                                    <label class="form-label">Username</label>
                                    <input type="text" id="userUsername" class="form-control" placeholder="your username" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Password</label>
                                    <input type="password" id="userPassword" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Login</button>
                            </form>
                            <p class="text-center mt-3">
                                Don't have an account? 
                                <a href="#" data-bs-toggle="modal" data-bs-target="#signupModal">Sign up here</a>
                            </p>
                        </div>
                    </div>

                    <!-- Error Message -->
                    <div id="loginError" class="alert alert-danger d-none mt-3" role="alert"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Signup Modal -->
<div class="modal fade" id="signupModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form onsubmit="handleSignup(event)">
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" id="signupUsername" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" id="signupPassword" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" id="signupConfirm" class="form-control" required>
                    </div>
                    <div id="signupError" class="alert alert-danger d-none"></div>
                    <button type="submit" class="btn btn-success w-100">Sign Up</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
