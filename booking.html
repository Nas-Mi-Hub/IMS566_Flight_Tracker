<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Flight - AeroTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<!-- Navigation -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html">✈️ AeroTrack</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="flights.html">Active Flights</a></li>
                <li class="nav-item"><a class="nav-link" href="fleet.html">Our Fleet</a></li>
                <li class="nav-item"><a class="nav-link active" href="booking.html">Book Now</a></li>
            </ul>
            <span id="userDisplay" class="navbar-text me-3 text-light"></span>
            <a href="index.html" class="btn btn-danger btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <h2 class="mb-4">Book Aircraft</h2>
    
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-body">
                    <form id="bookingForm" onsubmit="handleBooking(event)">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Aircraft Type</label>
                                <select id="aircraftType" class="form-select" required>
                                    <option value="">Select Aircraft</option>
                                    <option value="Boeing 737 Max">Boeing 737 Max</option>
                                    <option value="Airbus A350">Airbus A350</option>
                                    <option value="Boeing 777-300ER">Boeing 777-300ER</option>
                                    <option value="Airbus A320neo">Airbus A320neo</option>
                                    <option value="Boeing 787 Dreamliner">Boeing 787 Dreamliner</option>
                                    <option value="Embraer E190">Embraer E190</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Number of Passengers</label>
                                <input type="number" id="passengers" class="form-control" min="1" max="400" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Origin</label>
                                <input type="text" id="origin" class="form-control" placeholder="KUL" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Destination</label>
                                <input type="text" id="destination" class="form-control" placeholder="LHR" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Departure Date</label>
                                <input type="date" id="departureDate" class="form-control" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Return Date (Optional)</label>
                                <input type="date" id="returnDate" class="form-control">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 mt-3">Book Flight</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="bookingConfirmation" class="mt-4 d-none">
        <div class="alert alert-success">
            <h5>Booking Confirmed!</h5>
            <p id="confirmationDetails"></p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

<script>
    // Additional booking logic
    function handleBooking(event) {
        event.preventDefault();
        
        const aircraft = document.getElementById('aircraftType').value;
        const origin = document.getElementById('origin').value;
        const destination = document.getElementById('destination').value;
        const passengers = document.getElementById('passengers').value;
        const date = document.getElementById('departureDate').value;

        if (!aircraft || !origin || !destination || !passengers || !date) {
            alert("Please fill all required fields.");
            return;
        }

        const confirmation = document.getElementById('bookingConfirmation');
        document.getElementById('confirmationDetails').innerHTML = `
            <strong>${aircraft}</strong><br>
            ${origin} → ${destination}<br>
            Passengers: ${passengers}<br>
            Date: ${date}
        `;
        confirmation.classList.remove('d-none');
        
        // Reset form
        event.target.reset();
        
        // Add to local bookings
        let bookings = JSON.parse(localStorage.getItem('bookings')) || [];
        bookings.push({ aircraft, origin, destination, passengers, date, user: localStorage.getItem('currentUser') });
        localStorage.setItem('bookings', JSON.stringify(bookings));
    }
</script>
</body>
</html>
